name: Published website security validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify installed Linux security dependencies
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const sharp = require('sharp');
          assert.equal(process.platform, 'linux');
          assert.equal(require('next/package.json').version, '16.4.1');
          assert.equal(sharp.versions.sharp, '0.35.5');
          console.log(JSON.stringify({ next: require('next/package.json').version, sharp: sharp.versions.sharp, libvips: sharp.versions.vips, glibc: process.report.getReport().header.glibcVersionRuntime }));
          sharp({ create: { width: 2, height: 2, channels: 3, background: '#357' } }).png().toBuffer().then(buffer => assert(buffer.length > 0)).catch(() => process.exit(1));
          NODE
      - run: npm run build
      - run: npm run typecheck
      - run: git diff --check
